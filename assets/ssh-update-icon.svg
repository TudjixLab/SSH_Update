 <linearGradient id="neon" x1="200" y1="120" x2="1060" y2="1130" gradientUnits="userSpaceOnUse"><stop stop-color="#fffaff"/><stop offset=".22" stop-color="#f3caff"/><stop offset=".52" stop-color="#bd54ff"/><stop offset=".78" stop-color="#8650ff"/><stop offset="1" stop-color="#e8a4ff"/></linearGradient>
 <linearGradient id="arrow" x1="280" y1="250" x2="970" y2="950" gradientUnits="userSpaceOnUse"><stop stop-color="#fff"/><stop offset=".25" stop-color="#e8c5ff"/><stop offset=".6" stop-color="#a46cff"/><stop offset="1" stop-color="#6c42d7"/></linearGradient>
 <linearGradient id="bar" x1="290" y1="1010" x2="960" y2="1010" gradientUnits="userSpaceOnUse"><stop stop-color="#d43dff"/><stop offset=".23" stop-color="#fff0ff"/><stop offset=".5" stop-color="#c98aff"/><stop offset="1" stop-color="#5730bc"/></linearGradient>
 <filter id="outerGlow" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="23" result="b"/><feColorMatrix in="b" type="matrix" values="1 0 0 0 .35 0 0 1 0 0 .05 0 0 1 0 .7 0 0 1 0" result="c"/><feMerge><feMergeNode in="c"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
 <filter id="softGlow" x="-40%" y="-40%" width="180%" height="180%"><feGaussianBlur stdDeviation="10" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
 <clipPath id="tile"><rect x="99" y="110" width="1056" height="1034" rx="255"/></clipPath>
</defs>
