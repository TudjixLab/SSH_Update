<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1254 1254" role="img" aria-labelledby="title desc">
<title id="title">SSH Update — фирменный знак</title>
<desc id="desc">Неоновый фиолетовый знак: шестерёнка, круговые стрелки синхронизации, фирменная спираль и индикатор процесса на тёмной скруглённой плашке.</desc>
<defs>
