[workspace]
members = ["crates/uli4", "crates/protocol", "crates/state", "services/uli-ups"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.100"
publish = false

[workspace.dependencies]
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.145"
sha2 = "=0.10.9"
ed25519-dalek = "=2.2.0"
hex = "=0.4.3"
zstd = "=0.13.3"
unicode-normalization = "=0.1.24"
caseless = "=0.2.2"
tempfile = "=3.23.0"

[profile.release]
lto = "thin"
codegen-units = 1
